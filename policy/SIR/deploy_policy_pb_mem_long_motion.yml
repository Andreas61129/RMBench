# Manually written, mirroring exactly what scripts/run_memory_cell.sh would have auto-generated
# for pb_mem_long_motion -- that cell's training completed fully on 23.08 (epoch_100 checkpoint,
# "Training done." in train.log) but its eval was interrupted at 12/100 episodes and never
# finished. Rather than retrain (wasted ~2.5-3h), this deploy yml lets us eval the checkpoint
# that already exists.
policy_name: null
task_name: null
task_config: null
ckpt_setting: null
seed: null
instruction_type: unseen

sir_repo_path: /mnt/projects/Temporal_Scene_Graphs/sir_rmbench/temporal_scene_graphs
checkpoint: /mnt/projects/Temporal_Scene_Graphs/temporal_scene_graphs/logs/robomme/keyframe_runs/pb_mem_long_motion
checkpoint_epoch: 100
device: null
execute_horizon: 64
use_ema: true
use_graph: true
config_overrides: ["manager=rmbench_graph_memory_press_button", "manager.task_names=[press_button]", "method/graph_encoder=gnn_weighted", "manager.keyframe_detector=motion", "manager.graph_memory_schedule=keyframe"]
