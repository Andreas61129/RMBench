# Basic experiment configuration (keep unchanged, per RMBench's Your_Policy template)
policy_name: null
task_name: null
task_config: null
ckpt_setting: null
seed: null
instruction_type: unseen

# sir_baseline-specific parameters
sir_repo_path: /mnt/projects/Temporal_Scene_Graphs/sir_rmbench/temporal_scene_graphs
checkpoint: /mnt/projects/Temporal_Scene_Graphs/sir_rmbench/temporal_scene_graphs/logs/rmbench/2026-08-01/07-22-17
checkpoint_epoch: null  # if set (e.g. 100), load action_generator_epoch_<N>.pth etc. from the
                         # checkpoint dir instead of the *_final.pth files (only valid for epochs
                         # trainer.checkpoint_every actually snapshotted)
device: null  # null = auto (cuda:0 if available else cpu)
execute_horizon: 64  # actions executed per get_action() call before re-querying the model.
                      # SIR is variant=non_temporal (no recurrent/temporal state -- see
                      # sir_baseline/configs/main.yaml), so the window-desync pitfall in
                      # rmbench_onboarding.md (written for recurrent models like AnoleVLM) does not
                      # apply here. SIR's own native evaluator defaults to full-chunk execution
                      # (replan_period=None, see sir_baseline/evaluator/robomme_tester.py's
                      # "sir_main_non_temporal behaviour"); 64 is >= any realistic act_window so the
                      # full predicted chunk always executes, matching that native default (same
                      # pattern already used by evaluate_rmbench_offline.py's offline diagnostic).
use_ema: true
use_graph: false  # true = grab on-the-fly segmentation/depth per step and build graph obs_dict
                   # entries (Tier 2, best-effort -- see sir_baseline/rmbench_adapter.py). Must
                   # match whether the checkpoint was trained with graph_modalities set.
config_overrides: []  # extra Hydra overrides forwarded to sir_baseline's config, e.g.
                       # ["manager.task_names=[press_button]"]
